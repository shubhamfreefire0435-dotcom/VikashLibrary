<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Membership application</title><link rel="stylesheet" href="/styles.css"></head><body class="auth-page"><div class="auth-card glass" style="width:min(760px,100%)"><a class="brand" href="/"><span class="brand-mark">VL</span><span><strong>VIKASH LIBRARY</strong><small>MEMBERSHIP APPLICATION</small></span></a><h1>Apply for membership.</h1><p>Provide accurate information. Name, phone and address are required.</p><form id="f" class="stack">
<div class="row"><div class="field"><label>Full name *</label><input class="input" name="full_name" required></div><div class="field"><label>Date of birth</label><input class="input" name="dob" type="date"></div></div>
<div class="row"><div class="field"><label>Gender</label><select class="input" name="gender"><option value="">Prefer not to say</option><option>Female</option><option>Male</option><option>Other</option></select></div><div class="field"><label>Mobile number *</label><input class="input" name="phone" required></div></div>
<div class="row"><div class="field"><label>Email</label><input class="input" name="email" type="email"></div><div class="field"><label>Emergency contact</label><input class="input" name="emergency_contact"></div></div>
<div class="field"><label>Full address *</label><textarea class="input" name="address" required rows="2"></textarea></div>
<div class="row"><div class="field"><label>Parent / guardian name</label><input class="input" name="guardian_name"></div><div class="field"><label>Guardian phone</label><input class="input" name="guardian_phone"></div></div>
<div class="row"><div class="field"><label>Education</label><input class="input" name="education"></div><div class="field"><label>School / college</label><input class="input" name="school_college"></div></div>
<div class="row"><div class="field"><label>Occupation</label><input class="input" name="occupation"></div><div class="field"><label>Membership plan</label><select class="input" name="membership_plan"><option>standard</option><option>morning</option><option>evening</option><option>full-day</option></select></div></div>
<div class="row"><div class="field"><label>Photo (JPG/PNG/WebP, max 5 MB)</label><input class="input" name="photo" type="file" accept=".jpg,.jpeg,.png,.webp"></div><div class="field"><label>Supporting document (PDF/JPG/PNG, max 5 MB)</label><input class="input" name="document" type="file" accept=".pdf,.jpg,.jpeg,.png,.webp"></div></div>
<div class="field"><label>Document type</label><select class="input" name="document_type"><option value="">Choose if uploaded</option><option>School/College ID</option><option>Address proof</option><option>Other</option></select></div><p class="hint">Do not upload unmasked Aadhaar or highly sensitive documents unless legally necessary. Application needs admin review.</p><div id="m" class="message"></div><button class="button primary full">Submit application ↗</button><a href="/" class="links">Back to homepage</a></form></div><script src="/apply.js"></script></body></html>
